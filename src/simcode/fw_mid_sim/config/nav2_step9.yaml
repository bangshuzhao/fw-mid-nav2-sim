amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: scan
    tf_broadcast: true
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    set_initial_pose: true
    initial_pose: {x: 0.95, y: 0.0, z: 0.0, yaw: 0.0}
    laser_min_range: 0.40
    laser_max_range: 16.0

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      motion_model_for_search: REEDS_SHEPP
      minimum_turning_radius: 0.45
      angle_quantization_bins: 72
      lookup_table_size: 1.0
      allow_unknown: false
      tolerance: 0.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      track_unknown_space: true
      footprint: '[[0.34, 0.275], [0.34, -0.275], [-0.34, -0.275], [-0.34, 0.275]]'
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 3.0

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    odom_topic: /odometry/filtered
    failure_tolerance: 0.0
    controller_plugins: [FollowPath]
    goal_checker_plugins: [goal_checker]
    progress_checker:
      required_movement_radius: 0.05
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::StoppedGoalChecker
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.15
      trans_stopped_velocity: 0.035
      rot_stopped_velocity: 0.10
      stateful: false
    FollowPath:
      plugin: fw_mid_mppi/CuspMPPI
      motion_model: Ackermann
      AckermannConstraints: {min_turning_r: 0.45}
      vx_max: 0.25
      vx_min: -0.19
      model_dt: 0.05
      time_steps: 40
      batch_size: 700
      wz_max: 0.55
      enforce_path_inversion: true
      inversion_xy_tolerance: 0.045
      inversion_yaw_tolerance: 0.095
      stall_assistance: true
      cusp_departure_distance: 0.62
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathFollowCritic, PathDirectionCritic]
      CostCritic: {consider_footprint: true}
      PathDirectionCritic: {cost_weight: 24.0}
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 10.0
      always_send_full_costmap: true
      track_unknown_space: false
      footprint: '[[0.34, 0.275], [0.34, -0.275], [-0.34, -0.275], [-0.34, 0.275]]'
      plugins: [voxel_layer, inflation_layer]

      voxel_layer:
        plugin: fw_mid_voxel_layer/RollingVoxelLayer
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.10
        z_voxels: 16
        max_obstacle_height: 1.02
        mark_threshold: 0
        observation_sources: cloud
        cloud:
          topic: /lidar/points
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: 0.14
          max_obstacle_height: 1.02
          obstacle_min_range: 0.46
          obstacle_max_range: 4.6
          observation_persistence: 0.24
          expected_update_rate: 0.30

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

map_server:
  ros__parameters:
    use_sim_time: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 40.0
    feedback: OPEN_LOOP
    scale_velocities: true

    max_velocity: [0.25, 0.0, 0.55]
    min_velocity: [-0.19, 0.0, -0.55]
    max_accel: [0.65, 0.0, 1.90]
    max_decel: [-0.85, 0.0, -2.10]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.35
