# 场景专用参数叠加在 9C 的速度链和局部代价图配置上。
amcl:
  ros__parameters:
    initial_pose: {x: -4.8, y: 0.0, z: 0.0, yaw: 0.0}
    # 使用窄办公室参考场景的激光匹配参数。
    alpha1: 0.1
    alpha2: 0.12
    alpha3: 0.12
    alpha4: 0.1
    laser_max_range: 14.0
    max_beams: 100
    sigma_hit: 0.1
    update_min_d: 0.10
    update_min_a: 0.08
    transform_tolerance: 1.0

planner_server:
  ros__parameters:
    GridBased:
      lookup_table_size: 5.0

controller_server:
  ros__parameters:
    FollowPath:
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathDirectionCritic]
      GoalCritic: {cost_weight: 5.0, threshold_to_consider: 1.0}
      GoalAngleCritic: {cost_weight: 5.0, threshold_to_consider: 0.55}
      PathAlignCritic:
        cost_weight: 12.0
        offset_from_furthest: 12
        trajectory_point_step: 4
        threshold_to_consider: 0.55
        use_path_orientations: true
      PathFollowCritic: {cost_weight: 6.0, threshold_to_consider: 1.1}

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom

    cmd_vel_in_topic: /cmd_vel_feasible
    cmd_vel_out_topic: /cmd_vel

    transform_tolerance: 0.25
    source_timeout: 0.55
    stop_pub_timeout: 1.0

    polygons: [CrossingStop]
    CrossingStop:
      type: polygon
      action_type: stop
      points: [0.94, 0.37, 0.94, -0.37, -0.52, -0.37, -0.52, 0.37]
      max_points: 2
      visualize: true
      polygon_pub_topic: /traffic/stop_zone

    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
      enabled: true
